# Botforje-js Configuration Example
# This is a comprehensive example showing all available configuration options
# Copy this to ~/.config/botforje-js/config.yml and customize for your needs

# Global system configuration
chromium_path: "/usr/bin/chromium"  # Path to your Chromium/Chrome installation
address: "127.0.0.1"              # Bind address (127.0.0.1 = localhost only, 0.0.0.0 = all interfaces)
port: 3000                         # Port for REST API (set to enable the API)
log_level: "info"                  # Log level: info, debug, warn, error
# trusted_issuers: []              # External login server public keys
default_timeout: 300               # Global default timeout for graph sessions (seconds)

# Action Catalog — reusable actions that graphs reference by id
# Actions are universal: not tied to any specific bot or graph
actions:
  # Simple message action
  greet:
    steps:
      - message:
          body: "Hello! Welcome to our support chat. How can I help you today?"

  # Menu action with options
  menu:
    steps:
      - message:
          body: "Main menu:\n1. Hours & schedule\n2. Product catalog\n3. Talk to a human\n4. Pricing\n0. Exit"

  # Action with cooldown — same sender can't re-trigger within cooldown period
  escalate:
    guards:
      cooldown:
        duration: 120                # Seconds before same sender can trigger this again
        on_blocked:
          - message:
              body: "You already requested a human agent. Please wait, one will connect shortly."
    steps:
      - message:
          body: "Connecting you to a human agent. One moment please."
      - request:
          name: escalate-human
          url: "https://api.example.com/support/escalate"
          method: POST
          headers:
            Authorization: "Bearer your-api-token"
          timeout: 10000
          retry: 3

  # on_exit example — runs automatically when leaving a node
  log_navigation:
    steps:
      - request:
          name: nav-log
          url: "https://analytics.example.com/navigation"
          method: POST
          headers:
            X-API-Key: "your-analytics-key"
          timeout: 3000
          retry: 1

  # can_use example — actions the LLM can optionally invoke, each independently
  search_catalog:
    steps:
      - message:
          body: "Let me look that up in our catalog..."
      - request:
          name: catalog-search
          url: "https://api.example.com/catalog/search?q={{message.body}}"
          method: GET
          headers:
            Authorization: "Bearer token"
          timeout: 5000
          retry: 1

  # Dual request + responses chaining — two requests feed into a single message
  build-order:
    steps:
      - request:
          name: product-info
          url: "https://api.example.com/products/lookup"
          method: POST
          headers:
            Authorization: "Bearer your-api-token"
      - request:
          name: shipping-rate
          url: "https://api.example.com/shipping/rate?zip={{responses.product-info.zip}}"
          method: GET
          headers:
            Authorization: "Bearer your-api-token"
      - message:
          body: |
            Order summary:
            Product: {{responses.product-info.name}}
            Price: ${{responses.product-info.price}}
            Shipping: ${{responses.shipping-rate.cost}}

  # request-only action
  lead-notify:
    steps:
      - request:
          name: lead-capture
          url: "https://crm.example.com/leads"
          method: POST
          headers:
            X-API-Key: "your-crm-key"
          timeout: 5000
          retry: 2

  hours:
    steps:
      - message:
          body: "Our support hours:\n• Monday-Friday: 9:00 AM - 6:00 PM\n• Saturday: 10:00 AM - 2:00 PM\n• Sunday: Closed"

  catalog:
    steps:
      - message:
          body: "Here's our product catalog: https://example.com/catalog.pdf"

  pricing:
    steps:
      - message:
          body: "Our pricing starts at $29/month for the basic plan. Would you like more details?"

  invalid:
    steps:
      - message:
          body: "That option is not valid. Please choose a number from the menu."

  farewell:
    steps:
      - message:
          body: "Thank you! Have a great day. If you need anything else, just write 'menu'."

  pong:
    steps:
      - message:
          body: "pong!"

  # Send a WhatsApp location pin (combined with a text message)
  send-office:
    steps:
      - message:
          body: "Here is our office."
      - location:
          latitude: 19.4326
          longitude: -99.1332
          name: "Main Office"
          address: "Av. Reforma 123, CDMX"

# Graph Catalog — conversation state machines owned by a single bot
# Each graph has a root node, optional timeout, optional fallback, initial state and a map of nodes
graphs:
  # FAQ support graph with navigation menu
  faq-support:
    root: menu
    timeout: 300                   # Session TTL (seconds) — session dies after inactivity
    fallback: invalid         # Where to go if user sends an unexpected response
    state:                          # Initial session state — persists across nodes
      customer_name: ""
      visit_count: 0
    nodes:
      menu:
        on_enter:
          - menu
        on_exit:
          - log_navigation
        edges:
          - match: "1, hours, schedule, time, hours"
            fuzzy_threshold: 0.3    # 0.3=strict, 0.6=moderate (default), 0.9=loose
            goto: hours
          - match: "2, catalog, product, brochure"
            goto: catalog
          - match: "3, human, agent, person, talk, speak"
            goto: escalate
          - match: "4, price, pricing, cost"
            goto: pricing
          - match: "0, exit, bye, goodbye, end"
            goto: farewell
          - goto: invalid           # Default edge (no 'match'): catches everything else

      hours:
        on_enter:
          - hours
        edges:
          - match: "menu, back, return, volver"
            goto: menu
          - match: "0, exit"
            goto: farewell
          - goto: invalid

      catalog:
        on_enter:
          - catalog
        can_use:
          - search_catalog
        edges:
          - match: "menu, back"
            goto: menu
          - match: "0, exit"
            goto: farewell
          - goto: invalid

      escalate:
        on_enter:
          - escalate            # This action has cooldown guard
        edges:
          - match: "menu, back"
            goto: menu
          - match: "0, exit"
            goto: farewell
          - goto: invalid

      pricing:
        on_enter:
          - pricing
        state:                        # Per-node state — resets on every re-entry
          plan: ""
          budget: 0
        edges:
          - match: "menu, back"
            goto: menu
          - match: "0, exit"
            goto: farewell
          - match: "interested, buy, order, quote"
            goto: lead
          - goto: invalid

      lead:
        on_enter:
          - lead-notify
        edges:
          - match: "menu, back"
            goto: menu
          - goto: farewell

      invalid:
        on_enter:
          - invalid
        edges:
          - goto: menu               # Always return to menu after invalid input

      farewell:
        on_enter:
          - farewell
        edges: []                    # No edges — session stays alive until timeout

  # Minimal single-node graph
  ping-pong:
    root: ping
    nodes:
      ping:
        on_enter:
          - pong
        edges: []

bots:
  support-bot:
    graph: faq-support
    settings:
      queue_delay: 1500
      ignore_groups: true           # Ignore group messages
      # allowed_senders:            # Whitelist — only these senders trigger a response
      #   - "521234567890"          # Empty or undefined = all senders allowed
      ignored_senders:              # Senders to ignore entirely
        - "status@broadcast"        # WhatsApp status broadcasts

  # Sales bot reusing the same faq-support graph
  sales-bot:
    graph: faq-support
    settings:
      queue_delay: 1000
      ignore_groups: false          # Sales bot might engage in groups
      ignored_senders: []

# Actions, graphs, and bots can also be loaded from separate files in their respective
# directories (actions/, graphs/, bots/) in the config path. The file name becomes the entity ID.
# Inline definitions in this file take precedence over directory files.

# Notes:
# - Each bot references exactly one graph by name
# - names can only contain lowercase letters, numbers, and hyphens (no start/end hyphens, no consecutive)
# - bot phone numbers are automatically filled after WhatsApp QR code authentication
# - Edge match phrases are comma-separated, fuzzy-matched, if fails and ai enabled, llm tries to resolve
# - fuzzy_threshold: 0.3=strict, 0.6=moderate (default), 0.9=loose
# - Action cooldowns prevent spam (per sender per action)
# - Graph sessions automatically expire after timeout seconds of inactivity
# - fallback handles unexpected user responses without breaking the graph
# - Graph state defines initial session context (persists across nodes); node state resets on re-entry
# - Node fields:
#     on_enter: actions executed automatically when entering the node
#     on_exit:  actions executed automatically just before leaving the node
#     can_use:  actions the LLM can optionally invoke, each independently (only when AI is enabled)
#     state:    initial per-node context — reset every time the node is entered
# - Template variables use context-based paths: {{context.path.to.property}}
#   Read/write contexts (variables can be declared and modified at runtime):
#     session:  {{session.field}} — persistent across nodes, defined in graph state
#     node:     {{node.field}} — local to current node, defined in node state, resets on re-entry
#   Read-only contexts (system-provided):
#     sender:     {{sender.phone}}, {{sender.name}}
#     message:    {{message.body}}, {{message.at}}
#     bot:        {{bot.id}}, {{bot.phone}}, {{bot.graph}}
#     responses:  {{responses.request-name.field}} — from request steps in the same action
# - Location actions send a WhatsApp location pin; fields: latitude, longitude, name, address, url, description
